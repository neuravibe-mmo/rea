<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Chùa Online">
  <title>Chùa Online</title>
  <defs>
    <linearGradient id="co-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140d08"/>
      <stop offset="1" stop-color="#2a1a10"/>
    </linearGradient>
    <radialGradient id="co-glow" cx="256" cy="236" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0b25c" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#e0b25c" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#e0b25c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="co-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d08a"/>
      <stop offset="1" stop-color="#e0b25c"/>
    </linearGradient>
    <linearGradient id="co-petal-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9bf72"/>
      <stop offset="1" stop-color="#c99643"/>
    </linearGradient>
    <linearGradient id="co-petal-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a954"/>
      <stop offset="1" stop-color="#a8782f"/>
    </linearGradient>
  </defs>

  <!-- Nền: hình vuông bo góc, nâu ấm đậm -->
  <rect id="co-base" width="512" height="512" rx="112" fill="url(#co-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#co-glow)"/>

  <!--mark-->
  <g transform="translate(256 254) scale(1.12) translate(-256 -254)">
    <!-- Hoa sen 5 cánh: 2 cánh ngoài, 2 cánh giữa, 1 cánh chính giữa (vẽ từ sau ra trước) -->
    <g stroke="#1c1109" stroke-width="4" stroke-linejoin="round">
      <path transform="translate(256 292) rotate(-70)" fill="url(#co-petal-outer)"
        d="M0 0 C-38 -27 -34.2 -81 0 -108 C34.2 -81 38 -27 0 0Z"/>
      <path transform="translate(256 292) rotate(70)" fill="url(#co-petal-outer)"
        d="M0 0 C-38 -27 -34.2 -81 0 -108 C34.2 -81 38 -27 0 0Z"/>
      <path transform="translate(256 292) rotate(-35)" fill="url(#co-petal-side)"
        d="M0 0 C-44 -34.5 -39.6 -103.5 0 -138 C39.6 -103.5 44 -34.5 0 0Z"/>
      <path transform="translate(256 292) rotate(35)" fill="url(#co-petal-side)"
        d="M0 0 C-44 -34.5 -39.6 -103.5 0 -138 C39.6 -103.5 44 -34.5 0 0Z"/>
      <path transform="translate(256 292)" fill="url(#co-petal)"
        d="M0 0 C-46 -37.5 -41.4 -112.5 0 -150 C41.4 -112.5 46 -37.5 0 0Z"/>
    </g>
    <!-- Gân cánh chính giữa -->
    <path d="M256 284 C256 250 256 214 256 176" fill="none" stroke="#a8782f" stroke-opacity="0.45"
      stroke-width="3" stroke-linecap="round"/>

    <!-- Mặt nước: ba đường sóng nhẹ, nhạt dần xuống dưới -->
    <g fill="none" stroke="#e0b25c" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 316 Q154 302 188 316 T256 316 T324 316 T392 316" stroke-width="9"/>
      <path d="M160 342 Q192 330 224 342 T288 342 T352 342" stroke-width="7" stroke-opacity="0.55"/>
      <path d="M204 366 H308" stroke-width="6" stroke-opacity="0.28"/>
    </g>
  </g>
  <!--/mark-->
</svg>
